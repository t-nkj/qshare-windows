[package]
name = "qshare"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
build = "build.rs"

[[bin]]
name = "QShare"
path = "src/main.rs"

[dependencies]
anyhow = "1"
arboard = { version = "3.6", default-features = false }
clap = { version = "4.5", features = ["derive"] }
dotenvy = "0.15"
mime_guess = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Data_Xml_Dom", "Foundation_Collections", "UI_Notifications", "Win32_Storage_EnhancedStorage", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem"] }

[build-dependencies]
ico = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
winresource = "0.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
